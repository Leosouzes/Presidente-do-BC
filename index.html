<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copom: você decide a Selic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Newsreader:opsz,wght@6..72,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6ECE2; --card:#F5F8F1; --ink:#13292B; --muted:#587072; --teal:#0F5C57; --teal-ink:#F5F8F1;
  --gold:#D9A21B; --red:#B3342B; --green:#2E7D4F; --line:#C5D1C3;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif; --serif:'Newsreader',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0F1C1D;--card:#162728;--ink:#E3EDE6;--muted:#8FA9A8;--teal:#52C2B6;--teal-ink:#0F1C1D;--gold:#E8B84A;--red:#F07A6E;--green:#6FCB94;--line:#294042}
}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0 16px;border-bottom:2px solid var(--ink);margin-bottom:20px;flex-wrap:wrap}
.brand{font-weight:800;font-stretch:110%;font-size:20px;letter-spacing:-.01em}
.ticks{display:flex;gap:6px;align-items:center}
.tick{width:26px;height:10px;border:2px solid var(--ink);border-radius:2px;background:transparent}
.tick.done{background:var(--teal);border-color:var(--teal)}
.tick.now{background:var(--gold);border-color:var(--ink)}
.ticklabel{font-size:14px;color:var(--muted);margin-right:8px}
h1,h2,h3{margin:0;line-height:1.05}
.btn{border:2px solid var(--ink);background:transparent;border-radius:8px;padding:10px 16px;font-weight:700}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);padding:14px 22px;font-size:18px;font-stretch:105%}
.btn.primary:hover{filter:brightness(1.12);background:var(--teal);color:var(--teal-ink)}
.btn.small{padding:6px 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
/* start */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center;padding:12px 0 8px}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:900;font-stretch:118%;letter-spacing:-.03em}
.hero p.lead{font-family:var(--serif);font-size:20px;max-width:46ch;margin:16px 0 24px;line-height:1.5}
.modes{display:grid;gap:10px;margin-top:6px}
.mode{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;padding:14px 16px;border:2px solid var(--ink);border-radius:10px;background:var(--card)}
.mode:hover{border-color:var(--teal);box-shadow:4px 4px 0 var(--teal)}
.mode b{font-size:18px;font-stretch:105%}
.mode span{color:var(--muted);font-size:14px}
.opt{display:flex;gap:10px;align-items:flex-start;margin:16px 0;font-size:15px}
.opt input{margin-top:4px;width:18px;height:18px;accent-color:var(--teal)}
.seedrow{display:flex;gap:8px;margin-top:10px}
.seedrow input{flex:1;min-width:0;padding:10px;border:2px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.rules{margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rules .card{padding:14px}
.rules h3{font-size:16px;margin-bottom:6px}
.rules p{margin:0;font-size:14px;color:var(--muted)}
/* game */
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
.news{border-left:6px solid var(--gold);padding:4px 0 4px 16px;margin-bottom:18px}
.news h2{font-family:var(--serif);font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
.news p{font-family:var(--serif);font-size:19px;margin:0;line-height:1.5;max-width:60ch}
.news p.why{font-size:15px;font-style:italic;color:var(--muted);margin-top:8px}
.dial{padding:20px}
.dial .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dial .num{font-size:clamp(64px,13vw,112px);font-weight:900;font-stretch:125%;letter-spacing:-.04em;line-height:.95;font-variant-numeric:tabular-nums}
.dial .unit{font-size:28px;font-weight:700}
.delta{font-size:18px;font-weight:700;margin:6px 0 14px}
.delta.up{color:var(--red)}.delta.down{color:var(--teal)}.delta.flat{color:var(--muted)}
.ruler{width:100%;margin:6px 0 4px;accent-color:var(--teal);height:34px;cursor:pointer}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.quick .btn.sel{background:var(--ink);color:var(--paper)}
fieldset{border:0;margin:0 0 18px;padding:0}
legend{font-weight:700;margin-bottom:8px;padding:0}
.tones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tone input{position:absolute;opacity:0}
.tone span{display:block;border:2px solid var(--line);border-radius:8px;padding:10px;text-align:center;font-size:14px;font-weight:600;cursor:pointer}
.tone small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tone input:checked + span{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,transparent)}
.tone input:focus-visible + span{outline:3px solid var(--gold);outline-offset:2px}
.hint{background:color-mix(in srgb,var(--gold) 22%,transparent);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:28px;font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums}
.stat .d{font-size:13px;color:var(--muted)}
.stat.ok{border-color:var(--green)}.stat.bad{border-color:var(--red)}
.chartcard{margin-top:10px;padding:12px}
.chartcard h3{font-size:15px;margin-bottom:6px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin-top:4px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* resultado da rodada */
.out h2{font-size:28px;margin-bottom:6px}
.out ul{padding-left:20px;margin:12px 0}
.out li{margin:6px 0}
.pts{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.pt{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.pt b{font-size:20px;display:block}
.table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.table td,.table th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.table td:first-child,.table th:first-child{text-align:left}
.table th{font-weight:600;color:var(--muted);font-size:13px}
/* final */
.final{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.score{font-size:clamp(80px,16vw,150px);font-weight:900;font-stretch:125%;letter-spacing:-.04em;line-height:.9}
.grade{font-size:26px;font-weight:800;margin:8px 0}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.badge{border:2px solid var(--gold);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.rank{list-style:none;margin:8px 0 0;padding:0}
.rank li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.rank li.me{font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
footer{margin-top:36px;font-size:13px;color:var(--muted);max-width:80ch}
.hidden{display:none!important}
@media(max-width:820px){
  .hero,.grid,.final{grid-template-columns:1fr}
  .rules{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Copom: você decide</div>
    <div class="ticks" id="ticks" aria-live="polite"></div>
  </header>
  <main id="app"></main>
  <footer>Simulador educativo com modelo simplificado e cenários fictícios. Não é recomendação de investimento nem previsão econômica. Meta de inflação: 3% ao ano, com tolerância de 1,5% a 4,5%.</footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
// ENGINE_START
const META = 3.0, BANDA_MIN = 1.5, BANDA_MAX = 4.5, RSTAR = 5.5;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// sup: choque de oferta (p.p. no IPCA 12m) | dem: choque de demanda (hiato) | fx: pressão cambial (%)
// exp: choque nas expectativas | fed: variação do juro americano | pressure: 'cut' = governo pressiona por corte
const SCENARIOS = [
  { id: 'petroleo', titulo: 'Petróleo dispara com tensão no Oriente Médio', texto: 'O barril sobe forte e a Petrobras avalia reajustar combustíveis. Economistas já revisam o IPCA para cima.', sup: 0.55, fx: 2.5, dem: -0.1 },
  { id: 'safra', titulo: 'Safra recorde derruba preço dos alimentos', texto: 'Hortifrúti e grãos ficam mais baratos no atacado. O alívio chega às prateleiras nas próximas semanas.', sup: -0.5, dem: 0.1 },
  { id: 'fed', titulo: 'Fed surpreende e sobe os juros americanos', texto: 'O banco central dos EUA eleva a taxa em 0,50 p.p. Dinheiro estrangeiro volta para o dólar e o real perde valor.', fed: 0.5, fx: 3.5, dem: -0.1 },
  { id: 'fiscal', titulo: 'Governo anuncia pacote de gastos sem compensação', texto: 'A equipe econômica libera despesas fora do arcabouço fiscal. O mercado reage mal e o dólar sobe.', dem: 0.6, exp: 0.25, fx: 3.0 },
  { id: 'emprego', titulo: 'Mercado de trabalho aquece e salários sobem', texto: 'O desemprego chega ao menor nível da série e os reajustes salariais superam a inflação em serviços.', dem: 0.4, sup: 0.2, exp: 0.1 },
  { id: 'energia', titulo: 'Seca castiga hidrelétricas e conta de luz sobe', texto: 'A bandeira tarifária vai para o vermelho. Os preços administrados pressionam o índice cheio.', sup: 0.6, dem: -0.2 },
  { id: 'politica', titulo: 'Planalto e Congresso pedem cortes de juros', texto: 'Em discurso, o governo diz que a Selic alta "sufoca o crescimento". A imprensa pergunta se o BC vai ceder.', pressure: 'cut', exp: 0.1 },
  { id: 'china', titulo: 'China desacelera e commodities caem', texto: 'Minério e soja recuam. As exportações brasileiras perdem fôlego, mas a inflação importada diminui.', sup: -0.3, dem: -0.35, fx: 1.5 },
  { id: 'credito', titulo: 'Crédito ao consumidor cresce em ritmo forte', texto: 'Os bancos ampliam concessões e as vendas do varejo surpreendem. A demanda doméstica ganha tração.', dem: 0.55 },
  { id: 'recessao_global', titulo: 'Economia global esfria', texto: 'PMIs fracos nos EUA e na Europa. Investidores correm para ativos seguros e o dólar se fortalece.', dem: -0.55, fx: 3.0 },
  { id: 'desancora', titulo: 'Focus mostra expectativas desancorando', texto: 'Os economistas do mercado elevam as projeções de inflação para os próximos dois anos. A credibilidade do BC é testada.', exp: 0.5 },
  { id: 'fluxo', titulo: 'Fluxo estrangeiro volta à bolsa e ao real', texto: 'Investidores trazem dólares para o país. A moeda se valoriza e alivia a pressão sobre os preços.', fx: -5, sup: -0.15, exp: -0.1 },
  { id: 'greve', titulo: 'Greve de caminhoneiros afeta o abastecimento', texto: 'Estradas bloqueadas elevam o frete e faltam produtos em algumas cidades. O choque deve ser temporário, mas dói agora.', sup: 0.5, dem: -0.3 },
  { id: 'tarifa', titulo: 'Tarifa de energia cai com chuvas acima da média', texto: 'Os reservatórios se recuperam e a bandeira verde volta. O IPCA ganha um alívio administrado.', sup: -0.45 },
  { id: 'confianca', titulo: 'Confiança do consumidor despenca', texto: 'A prévia do índice de confiança cai ao pior nível em dois anos e o varejo corta estoques.', dem: -0.55 },
  { id: 'reajuste', titulo: 'Reajustes de planos de saúde e remédios', texto: 'Itens regulados sobem acima do esperado e entram no índice do mês.', sup: 0.3 },
  { id: 'bancos', titulo: 'Quebra de banco médio assusta o mercado', texto: 'Um banco regional tem problemas de liquidez. O crédito fica mais seletivo e a bolsa cai.', dem: -0.4, fx: 2.5, exp: -0.05 },
  { id: 'reforma', titulo: 'Reforma aprovada melhora o cenário fiscal', texto: 'O Congresso aprova medida de ajuste. O prêmio de risco cai e as expectativas de inflação recuam.', exp: -0.3, fx: -3, dem: -0.1 },
  { id: 'ipca15', titulo: 'Prévia da inflação vem acima do esperado', texto: 'O IPCA-15 surpreende com alta em serviços e alimentação. Analistas refazem as contas para o ano.', sup: 0.3, exp: 0.1 },
  { id: 'ipca_baixo', titulo: 'Prévia da inflação surpreende para baixo', texto: 'Alimentos e bens industriais desaceleram mais do que o mercado previa. O Focus começa a ser revisado.', sup: -0.3, exp: -0.1 },
  { id: 'eleicao', titulo: 'Incerteza eleitoral aumenta', texto: 'Pesquisas apertadas e promessas de gasto assustam investidores. O dólar sobe e o Focus desanca.', fx: 4, exp: 0.2 },
  { id: 'diretor', titulo: 'Declaração ambígua de um diretor do BC divide o mercado', texto: 'Parte dos analistas entende que o ciclo de cortes acabou; outra parte, que vai acelerar. Os juros futuros oscilam forte.', exp: 0.15, fx: 1.5 },
  { id: 'bolsa', titulo: 'Bolsa em máxima histórica', texto: 'O efeito riqueza anima o consumo de alta renda e os bancos de investimento voltam a fazer ofertas.', dem: 0.25, fx: -2 },
  { id: 'minimo', titulo: 'Salário mínimo tem reajuste acima da inflação', texto: 'A renda das famílias mais pobres sobe e o consumo de bens básicos ganha força, junto com serviços.', dem: 0.35, sup: 0.15 },
  { id: 'inadimplencia', titulo: 'Inadimplência das famílias bate recorde', texto: 'Os bancos fecham a torneira do crédito pessoal. O consumo desacelera mesmo sem mudança nos juros.', dem: -0.45 },
  { id: 'geada', titulo: 'Geada atinge lavouras no Sul e no Centro-Oeste', texto: 'Café, milho e hortaliças ficam mais caros. O choque é de oferta e pode durar alguns meses.', sup: 0.45 },
  { id: 'petroleo_baixo', titulo: 'Petróleo cai com aumento da oferta global', texto: 'A gasolina deve ficar mais barata nas refinarias. O dólar também ganha algum alívio.', sup: -0.4, fx: -1.5 },
  { id: 'concessoes', titulo: 'Leilão de concessões atrai investimento privado', texto: 'Estradas, portos e saneamento recebem bilhões. A demanda por obras cresce, mas a oferta também.', dem: 0.3, exp: -0.05 },
  { id: 'argentina', titulo: 'Crise na Argentina contagia vizinhos', texto: 'A desvalorização do peso assusta emergentes. O real sofre junto, mesmo sem relação direta.', fx: 2, dem: -0.15 },
  { id: 'fed_corta', titulo: 'Fed corta juros e o dólar perde força', texto: 'O banco central americano reduz a taxa em 0,50 p.p. O fluxo para emergentes melhora.', fed: -0.5, fx: -3.5, dem: 0.1 },
  { id: 'imobiliario', titulo: 'Financiamento imobiliário em alta', texto: 'Mais crédito para a casa própria aquece construção civil, móveis e eletrodomésticos.', dem: 0.4 },
  { id: 'tarifaco', titulo: 'EUA anunciam tarifas sobre produtos brasileiros', texto: 'Exportadores de aço, carne e aeronaves sentem o golpe. O real perde valor e os investimentos são adiados.', fx: 3, dem: -0.35, sup: 0.1 },
  { id: 'produtividade', titulo: 'Ganhos de produtividade surpreendem', texto: 'Automação e IA reduzem custos em serviços e indústria. A economia cresce sem pressionar tanto os preços.', sup: -0.2, dem: 0.2 },
  { id: 'dissidio', titulo: 'Grandes categorias fecham dissídios acima da inflação', texto: 'Bancários, metalúrgicos e petroleiros têm ganho real. O custo de serviços sobe.', sup: 0.25, dem: 0.2, exp: 0.1 },
  { id: 'rating_up', titulo: 'Agência eleva a nota de crédito do Brasil', texto: 'O grau de investimento fica mais perto. Dólares entram e o prêmio de risco cai.', fx: -4, exp: -0.15 },
  { id: 'rating_down', titulo: 'Agência rebaixa a nota de crédito do Brasil', texto: 'Preocupação com a dívida pública pesa. Fundos reduzem exposição ao país.', fx: 4, exp: 0.25, dem: -0.2 },
  { id: 'agua', titulo: 'Racionamento de água em grandes cidades', texto: 'Tarifas de saneamento sobem e a indústria reduz turnos. Há impacto em preços e em produção.', sup: 0.35, dem: -0.2 },
  { id: 'turismo', titulo: 'Verão aquece turismo e serviços', texto: 'Passagens aéreas, hotéis e restaurantes batem recorde de movimento e de preço.', dem: 0.3, sup: 0.15 },
  { id: 'combustivel', titulo: 'Governo corta tributos sobre combustíveis', texto: 'A gasolina baixa, mas a perda de arrecadação preocupa o mercado. O alívio de preço vem com ruído fiscal.', sup: -0.35, exp: 0.15, fx: 1.5 },
  { id: 'desoneracao', titulo: 'Congresso amplia desonerações sem fonte de receita', texto: 'O custo fiscal sobe e o consumo é incentivado. Economistas alertam para pressão sobre os juros.', dem: 0.3, exp: 0.2 },
  { id: 'exporta', titulo: 'Exportações batem recorde', texto: 'Soja, carne e minério chegam a volumes inéditos. Entra muito dólar e a renda do agro cresce.', dem: 0.3, fx: -2.5 },
  { id: 'industria', titulo: 'Indústria e entidades patronais pedem corte de juros', texto: 'Federações dizem que a Selic alta "paralisou investimentos". O pleito ganha espaço na imprensa.', pressure: 'cut', dem: -0.1 },
];

function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pickScenarios(seed) {
  const rng = mulberry32(seed * 7919 + 13);
  let pool = shuffle(SCENARIOS, rng);
  // garante equilíbrio: ao menos 2 choques que pressionam preços e 2 que aliviam
  for (let tries = 0; tries < 20; tries++) {
    const pick = pool.slice(0, 8);
    const up = pick.filter(s => (s.sup || 0) + (s.dem || 0) * 0.5 + (s.exp || 0) > 0.25).length;
    const down = pick.filter(s => (s.sup || 0) + (s.dem || 0) * 0.5 + (s.exp || 0) < -0.2).length;
    if (up >= 2 && down >= 2) return pick;
    pool = shuffle(pool, rng);
  }
  return pool.slice(0, 8);
}

// Eventos que surgem como consequência das decisões do jogador
const CONDICIONAIS = [
  { id: 'c_ancora', cond: s => s.cred < 45, titulo: 'Mercado duvida do compromisso do BC com a meta', texto: 'Os últimos números e decisões minaram a confiança. Os juros longos sobem e as projeções do Focus acompanham.', exp: 0.3, fx: 2 },
  { id: 'c_cambio', cond: s => s.fx > 6.3, titulo: 'Dólar passa de R$ 6,30 e contamina os preços', texto: 'Importadores repassam o câmbio para eletrônicos, insumos e combustíveis.', sup: 0.4, exp: 0.1 },
  { id: 'c_desemprego', cond: s => s.unemp > 7.2, titulo: 'Desemprego alto vira bandeira política', texto: 'Sindicatos e parlamentares culpam os juros. O governo cobra o BC publicamente.', pressure: 'cut', dem: -0.15 },
  { id: 'c_carta', cond: s => s.ipca > BANDA_MAX, titulo: 'Inflação estoura o teto e o BC precisa se explicar', texto: 'Com o IPCA acima de 4,5%, o presidente do BC deve escrever uma carta aberta ao ministro da Fazenda explicando as causas.', exp: 0.15 },
  { id: 'c_boom', cond: s => s.gap > 1.5, titulo: 'Economia superaquecida: salários correm atrás dos preços', texto: 'Falta mão de obra em serviços e os reajustes superam a produtividade.', dem: 0.2, sup: 0.25 },
  { id: 'c_deflacao', cond: s => s.ipca < 2.0, titulo: 'Inflação despenca perto do piso da banda', texto: 'Com o IPCA abaixo de 2%, analistas perguntam se os juros ficaram apertados demais.', dem: -0.2, sup: -0.1 },
  { id: 'c_premio', cond: s => s.cred > 85 && s.exp < 3.3, titulo: 'Investidores premiam a credibilidade do BC', texto: 'O prêmio de risco cai e entram dólares. O BC ganha espaço para decidir com calma.', fx: -3, exp: -0.1 },
];
function scenarioFor(i, scs, s, ctx) {
  if (i >= 1 && i - ctx.last >= 2) {
    for (const c of CONDICIONAIS) {
      if (!ctx.used.has(c.id) && c.cond(s)) { ctx.used.add(c.id); ctx.last = i; return { ...c, isCond: true }; }
    }
  }
  return scs[i];
}

function initialState() {
  return { round: 0, selic: 13.75, ipca: 4.4, exp: 4.3, gap: 0.3, unemp: 5.8, fx: 5.5, cred: 70, sm: 3.95, fed: 4.0 };
}
const pib = s => 2.0 + 0.7 * s.gap;
function taylor(s) {
  const pi = 0.5 * (s.ipca + s.exp);
  return RSTAR + pi + 1.5 * (pi - META) + 0.5 * s.gap;
}
const roundQuarter = x => Math.round(x * 4) / 4;

function step(s, newSelic, tone, sc, rng) {
  const noise = () => (rng() + rng() + rng() - 1.5) * 1.15;
  const n = { ...s };
  const dS = newSelic - s.selic;
  n.round = s.round + 1;
  n.selic = newSelic;
  n.fed = s.fed + (sc.fed || 0);

  // credibilidade
  let credD = 0, resisted = false;
  const tay = taylor(s);
  if (sc.pressure === 'cut' && s.exp > META + 0.6) {
    if (dS < 0) credD -= 4; else { credD += 2; resisted = true; }
  }
  if (s.exp > META + 1.0 && dS < 0) credD -= 2;
  if (Math.abs(newSelic - tay) > 2.0) credD -= 2;
  if (Math.abs(newSelic - tay) <= 0.75) credD += 1;
  if (s.ipca <= BANDA_MAX && s.ipca >= BANDA_MIN && Math.abs(s.exp - META) <= 0.6) credD += 1;
  if (s.exp > META + 0.5 && tone < 0) credD -= 1;
  if (s.exp > META + 0.5 && tone > 0) credD += 1;
  if (s.gap < -1.5 && tone > 0) credD -= 1;
  n.cred = clamp(s.cred + credD, 5, 100);

  // transmissão da política (com defasagem)
  const rr = newSelic - s.exp;
  n.sm = 0.6 * s.sm + 0.4 * (rr - RSTAR);

  // câmbio
  const carry = newSelic - n.fed;
  let dfx = (sc.fx || 0) - 0.9 * dS - 0.25 * (carry - 9.75) - 0.05 * ((s.fx - 5.5) / 5.5) * 100 + noise() * 0.9;
  dfx = clamp(dfx, -9, 12);
  n.fx = clamp(s.fx * (1 + dfx / 100), 4.0, 8.5);

  // atividade
  n.gap = clamp(0.72 * s.gap - 0.15 * n.sm + 0.1 + (sc.dem || 0) + 0.02 * dfx + noise() * 0.12, -6, 6);
  const target = 6.2 - 0.4 * n.gap;
  n.unemp = clamp(s.unemp + 0.25 * (target - s.unemp), 3.2, 14);

  // inflação 12m
  n.ipca = clamp(s.ipca + 0.17 * (0.5 * s.gap + 0.5 * n.gap) + 0.30 * (s.exp - s.ipca) + (sc.sup || 0) + 0.04 * dfx + noise() * 0.08, 0, 20);

  // expectativas
  n.exp = clamp(s.exp + 0.22 * (n.ipca - s.exp) + 0.12 * (n.cred / 100) * (META - s.exp)
    + (sc.exp || 0) - 0.10 * tone * (0.3 + n.cred / 100) + (70 - n.cred) * 0.004 + noise() * 0.04, 1.5, 12);

  const dist = Math.abs(n.ipca - META), distE = Math.abs(n.exp - META);
  const parts = {
    inf: 40 * Math.max(0, 1 - (0.6 * dist + 0.4 * distE) / 1.8),
    act: 30 * Math.max(0, 1 - (n.gap < 0 ? Math.abs(n.gap) / 1.8 : n.gap / 2.4)),
    cr: 20 * n.cred / 100,
    st: 10 * Math.max(0, 1 - Math.abs(dfx) / 8),
  };
  parts.total = parts.inf + parts.act + parts.cr + parts.st;
  return { state: n, dS, dfx, credD, resisted, parts, tone, scId: sc.id };
}

function badges(hist) {
  const last = hist[hist.length - 1], out = [];
  if (last.ipca >= 2.5 && last.ipca <= 3.5) out.push(['Meta na mão', 'Terminou com o IPCA entre 2,5% e 3,5%.']);
  if (Math.abs(last.gap) <= 0.8 && last.ipca <= BANDA_MAX) out.push(['Pouso suave', 'Inflação dentro da banda e economia perto do potencial.']);
  if (hist.every(h => Math.abs(h.dS) <= 0.5)) out.push(['Sem sustos', 'Nenhuma decisão passou de 0,50 p.p.']);
  if (hist.some(h => h.resisted)) out.push(['Resistiu à pressão', 'Segurou a Selic quando o governo pediu corte.']);
  if (last.exp <= 3.5 && last.cred >= 80) out.push(['Expectativas ancoradas', 'Mercado acredita na meta.']);
  if (hist.filter(h => h.parts.total >= 80).length >= 5) out.push(['Consistência', 'Cinco reuniões ou mais com nota 80+.']);
  return out;
}
function finalize(hist, veteran) {
  const avg = hist.reduce((a, h) => a + h.parts.total, 0) / hist.length;
  let score = Math.round(avg * 10);
  if (veteran) score = Math.min(1000, Math.round(score * 1.1));
  return { score, avg, badges: badges(hist) };
}
function grade(score) {
  if (score >= 650) return 'Lenda do Copom';
  if (score >= 590) return 'Guardião da Meta';
  if (score >= 540) return 'Gestor de Crise';
  if (score >= 490) return 'Diretor Prudente';
  if (score >= 430) return 'Estagiário Promovido';
  return 'Inflação Fora de Controle';
}

const sgn = (n, d = 2) => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n), d);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function drawTicks() {
  const el = $('#ticks');

  let h = `<span class="ticklabel">Reunião ${Math.min(G.idx + 1, 8)} de 8</span>`;

  el.innerHTML = h;
}

function startGame(seed, veteran) {
  G = { seed, veteran, scs: pickScenarios(seed), rng: mulberry32(seed), s: initialState(), hist: [], idx: 0, phase: 'decide', ctx: { used: new Set(), last: -9 }, series: [{ selic: 13.75, ipca: 4.4, exp: 4.3 }] };
  renderRound();
}

function chart(series, key, min, max, band) {
  const W = 360, H = 130, p = 22, n = series[0].length;
  const x = i => p + (n === 1 ? 0 : i * (W - p - 8) / (n - 1));
  const y = v => H - 18 - ((v - min) / (max - min)) * (H - 30);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${key}">`;
  if (band) svg += `<rect x="${p}" y="${y(band[1])}" width="${W - p - 8}" height="${y(band[0]) - y(band[1])}" fill="var(--green)" opacity=".16"/>`;
  [min, (min + max) / 2, max].forEach(v => svg += `<text x="0" y="${y(v) + 4}" font-size="10" fill="var(--muted)">${Math.round(v)}</text><line x1="${p}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`);
  series.forEach((vals, k) => {
    const colors = key === 'selic' ? ['var(--teal)'] : ['var(--red)', 'var(--gold)'];
    const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(clamp(v, min, max)).toFixed(1)}`).join(' ');
    svg += `<path d="${d}" fill="none" stroke="${colors[k]}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = vals[vals.length - 1];
    svg += `<circle cx="${x(vals.length - 1)}" cy="${y(clamp(last, min, max))}" r="4" fill="${colors[k]}"/>`;
  });
  return svg + '</svg>';
}

function statCard(label, value, sub, cls = '') {
  return `<div class="stat ${cls}"><div class="l">${label}</div><div class="v">${value}</div><div class="d">${sub}</div></div>`;
}
function dashboard() {
  const s = G.s, prev = G.hist.length ? G.hist[G.hist.length - 1].prev : null;
  const dlt = (a, b, d = 2, suf = ' p.p.') => prev ? `${sgn(a - b, d)}${suf} desde a última` : 'ponto de partida';
  const inBand = s.ipca >= BANDA_MIN && s.ipca <= BANDA_MAX;
  const sel = G.series;
  return `<div class="stats">
    ${statCard('IPCA em 12 meses', fmt(s.ipca) + '%', inBand ? 'dentro da banda (1,5% a 4,5%)' : 'fora da banda de tolerância', inBand ? 'ok' : 'bad')}
    ${statCard('Expectativa de inflação (Focus)', fmt(s.exp) + '%', dlt(s.exp, prev && prev.exp))}
    ${statCard('PIB em 12 meses', fmt(pib(s), 1) + '%', 'atividade ' + (s.gap > 0.4 ? 'aquecida' : s.gap < -0.8 ? 'em desaceleração' : 'perto do potencial'))}
    ${statCard('Desemprego', fmt(s.unemp, 1) + '%', dlt(s.unemp, prev && prev.unemp, 1))}
    ${statCard('Dólar', 'R$ ' + fmt(s.fx), 'juro americano em ' + fmt(s.fed) + '%')}
    ${statCard('Credibilidade do BC', Math.round(s.cred) + '/100', s.cred >= 70 ? 'mercado confia na meta' : 'âncora fragilizada', s.cred < 45 ? 'bad' : '')}
  </div>
  <div class="card chartcard"><h3>Selic ao longo do mandato</h3>${chart([sel.map(r => r.selic)], 'selic', 2, 25)}</div>
  <div class="card chartcard"><h3>Inflação e expectativas</h3>${chart([sel.map(r => r.ipca), sel.map(r => r.exp)], 'infl', 0, 10, [BANDA_MIN, BANDA_MAX])}
    <div class="legend"><span><i style="background:var(--red)"></i>IPCA 12m</span><span><i style="background:var(--gold)"></i>Focus</span><span><i style="background:var(--green);opacity:.4"></i>banda da meta</span></div></div>`;
}

function renderRound() {
  G.phase = 'decide'; drawTicks();
  const s = G.s;
  const sc = G.scs[G.idx] = scenarioFor(G.idx, G.scs, s, G.ctx);
  const tay = roundQuarter(taylor(s));
  const lo = Math.max(2, s.selic - 3), hi = Math.min(25, s.selic + 3);
  G.choice = s.selic; G.tone = 0;
  app.innerHTML = `
  <div class="grid">
    <div>
      <article class="news" aria-labelledby="nt"><h2 id="nt">${sc.titulo}</h2><p>${sc.texto}</p>${sc.isCond ? '<p class="why">Este evento surgiu por causa dos seus números.</p>' : ''}</article>

        </div>
        ${G.veteran ? '' : `<div class="hint">A equipe técnica sugere uma Selic entre <b>${fmt(Math.max(2, tay - 0.5))}%</b> e <b>${fmt(tay + 0.5)}%</b>. É só um parecer: o voto é seu.</div>`}
        <fieldset><legend>Tom do comunicado</legend>
          <div class="tones">

            <label class="tone"><input type="radio" name="tone" value="0" checked><span>Neutro<small>depende dos dados</small></span></label>
            <label class="tone"><input type="radio" name="tone" value="-1"><span>Flexível<small>atento à atividade</small></span></label>

        <button class="btn primary" id="go">Anunciar decisão</button>

  const upd = () => {

  document.querySelectorAll('input[name=tone]').forEach(r => r.onchange = () => G.tone = parseInt(r.value, 10));
  $('#go').onclick = decide;
  upd();
}

function decide() {
  const prev = G.s, sc = G.scs[G.idx];
  const r = step(prev, G.choice, G.tone, sc, G.rng);
  G.s = r.state;
  G.hist.push({ ...r.state, prev, dS: r.dS, parts: r.parts, resisted: r.resisted, tone: G.tone, scId: sc.id, titulo: sc.titulo, credD: r.credD });
  G.series.push({ selic: r.state.selic, ipca: r.state.ipca, exp: r.state.exp });
  G.idx++;
  G.phase = 'outcome';
  renderOutcome(r, prev, sc);
}

function renderOutcome(r, prev, sc) {
  drawTicks();
  const s = G.s, p = r.parts, last = G.idx >= 8;
  const bullets = [];
  const dS = r.dS;
  bullets.push(dS === 0 ? 'O Copom manteve a Selic em ' + fmt(s.selic) + '%.' : `O Copom ${dS > 0 ? 'elevou' : 'cortou'} a Selic em ${fmt(Math.abs(dS))} p.p., para ${fmt(s.selic)}%.`);
  const di = s.ipca - prev.ipca, de = s.exp - prev.exp;
  bullets.push(`O IPCA em 12 meses ${di > 0.02 ? 'subiu' : di < -0.02 ? 'caiu' : 'ficou estável'} (${fmt(prev.ipca)}% → ${fmt(s.ipca)}%) e as expectativas ${de > 0.02 ? 'pioraram' : de < -0.02 ? 'melhoraram' : 'ficaram estáveis'} (${fmt(prev.exp)}% → ${fmt(s.exp)}%).`);
  const dg = s.gap - prev.gap;
  bullets.push(`A atividade ${dg > 0.15 ? 'ganhou ritmo' : dg < -0.15 ? 'perdeu ritmo' : 'seguiu estável'}; o desemprego está em ${fmt(s.unemp, 1)}%.`);
  if (Math.abs(r.dfx) > 2) bullets.push(`O dólar ${r.dfx > 0 ? 'subiu' : 'caiu'} ${fmt(Math.abs(r.dfx), 1)}% e fechou a R$ ${fmt(s.fx)}.`);
  if (r.resisted) bullets.push('Você resistiu à pressão política com as expectativas desancoradas. O mercado notou.');
  else if (sc.pressure === 'cut' && dS < 0 && prev.exp > META + 0.6) bullets.push('Cortar sob pressão política, com a inflação esperada acima da meta, custou credibilidade.');
  if (r.credD <= -3) bullets.push('A decisão chamou atenção negativa do mercado e a credibilidade caiu.');
  else if (r.credD >= 2) bullets.push('A decisão foi bem recebida e a credibilidade subiu.');
  app.innerHTML = `

      <h2>Comunicado do Copom</h2>
      <p style="color:var(--muted);margin:0">${sc.titulo}</p>

        <div class="pt"><b>${Math.round(p.inf)}/40</b>inflação</div>
        <div class="pt"><b>${Math.round(p.act)}/30</b>atividade</div>
        <div class="pt"><b>${Math.round(p.cr)}/20</b>credibilidade</div>
        <div class="pt"><b>${Math.round(p.st)}/10</b>câmbio</div>
      </div>
      <button class="btn primary" id="next">${last ? 'Ver resultado final' : 'Próxima reunião'}</button>
    </section>
    <div>
      <table class="table card" style="display:table"><thead><tr><th>Indicador</th><th>Antes</th><th>Depois</th></tr></thead><tbody>
        <tr><td>Selic</td><td>${fmt(prev.selic)}%</td><td>${fmt(s.selic)}%</td></tr>
        <tr><td>IPCA 12m</td><td>${fmt(prev.ipca)}%</td><td>${fmt(s.ipca)}%</td></tr>
        <tr><td>Focus</td><td>${fmt(prev.exp)}%</td><td>${fmt(s.exp)}%</td></tr>
        <tr><td>PIB 12m</td><td>${fmt(pib(prev), 1)}%</td><td>${fmt(pib(s), 1)}%</td></tr>
        <tr><td>Desemprego</td><td>${fmt(prev.unemp, 1)}%</td><td>${fmt(s.unemp, 1)}%</td></tr>
        <tr><td>Dólar</td><td>R$ ${fmt(prev.fx)}</td><td>R$ ${fmt(s.fx)}</td></tr>
        <tr><td>Credibilidade</td><td>${Math.round(prev.cred)}</td><td>${Math.round(s.cred)}</td></tr>
      </tbody></table>
    </div>
  </div>`;
  $('#next').onclick = () => last ? renderFinal() : renderRound();
  window.scrollTo({ top: 0 });
}

  x.fillStyle = '#E6ECE2'; x.fillRect(48, 48, 984, 1254);
  x.fillStyle = '#13292B'; x.font = `800 44px ${sans}`; x.fillText('Copom: você decide', 96, 140);
  x.fillStyle = '#D9A21B'; x.fillRect(96, 170, 160, 10);
  x.fillStyle = '#13292B'; x.font = `900 280px ${sans}`; x.fillText(String(f.score), 90, 470);
  x.font = `800 60px ${sans}`; x.fillText(g, 96, 570);
  x.font = `400 34px ${sans}`; x.fillStyle = '#587072'; x.fillText('pontos de 1000' + (G.veteran ? ' · modo veterano' : ''), 96, 625);
  const rows = [['Selic final', fmt(s.selic) + '%'], ['IPCA em 12 meses', fmt(s.ipca) + '%'], ['Expectativa Focus', fmt(s.exp) + '%'], ['Desemprego', fmt(s.unemp, 1) + '%'], ['Credibilidade', Math.round(s.cred) + '/100']];
  rows.forEach((r, i) => {
    const y = 740 + i * 95;
    x.fillStyle = '#C5D1C3'; x.fillRect(96, y + 30, 888, 3);
    x.fillStyle = '#13292B'; x.font = `500 38px ${sans}`; x.fillText(r[0], 96, y);
    x.font = `800 44px ${sans}`; x.textAlign = 'right'; x.fillText(r[1], 984, y); x.textAlign = 'left';
  });
  x.fillStyle = '#13292B'; x.font = `700 36px ${sans}`; x.fillText('Desafio #' + G.seed + ' · consegue me superar?', 96, 1250);
  return c;
}

function renderFinal() {
  G.phase = 'final'; drawTicks();
  const f = finalize(G.hist, G.veteran), g = grade(f.score), s = G.s;
  const inBand = G.hist.filter(h => h.ipca >= BANDA_MIN && h.ipca <= BANDA_MAX).length;
  app.innerHTML = `
  <div class="final">
    <section class="card">
      <h2 style="font-size:22px;margin-bottom:6px">Fim do mandato</h2>
      <div class="score" id="sc">${f.score}</div>
      <div class="grade">${g}</div>
      <p style="color:var(--muted);margin:0">de 1000 pontos${G.veteran ? ' (com bônus do modo veterano)' : ''} · desafio #${G.seed}</p>
      <div class="badges">${f.badges.map(b => `<span class="badge" title="${esc(b[1])}">${b[0]}</span>`).join('') || '<span style="color:var(--muted)">Nenhuma conquista desta vez.</span>'}</div>
      <div class="actions">
        <button class="btn primary" id="share">Compartilhar</button>
        <button class="btn" id="img">Baixar imagem</button>
        <button class="btn" id="again">Jogar de novo</button>
      </div>
      <div class="seedrow" style="margin-top:18px"><input id="nm" maxlength="20" placeholder="Seu nome para o ranking" aria-label="Seu nome"><button class="btn" id="save">Salvar</button></div>
      <div id="rk">${rankHtml(null)}</div>
    </section>
    <section>
      <div class="stats">
        ${statCard('Selic final', fmt(s.selic) + '%', 'começou em 13,75%')}
        ${statCard('IPCA final', fmt(s.ipca) + '%', inBand + ' de 8 reuniões dentro da banda', s.ipca <= BANDA_MAX && s.ipca >= BANDA_MIN ? 'ok' : 'bad')}
        ${statCard('Expectativa final', fmt(s.exp) + '%', 'meta de 3%')}
        ${statCard('Desemprego final', fmt(s.unemp, 1) + '%', 'começou em 5,8%')}
      </div>
      <div class="card chartcard"><h3>Sua Selic</h3>${chart([G.series.map(r => r.selic)], 'selic', 2, 25)}</div>
      <div class="card chartcard"><h3>Inflação e expectativas</h3>${chart([G.series.map(r => r.ipca), G.series.map(r => r.exp)], 'infl', 0, 10, [BANDA_MIN, BANDA_MAX])}</div>
      <table class="table card" style="display:table;margin-top:10px"><thead><tr><th>Reunião</th><th>Selic</th><th>Nota</th></tr></thead><tbody>
        ${G.hist.map((h, i) => `<tr><td>${i + 1}. ${esc(h.titulo.length > 34 ? h.titulo.slice(0, 33) + '…' : h.titulo)}</td><td>${fmt(h.selic)}%</td><td>${Math.round(h.parts.total)}</td></tr>`).join('')}
      </tbody></table>
    </section>
  </div>`;
  $('#again').onclick = renderStart;
  $('#share').onclick = async () => {
    const text = shareText(f, g);
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text); toast('Texto copiado'); } catch (e) { prompt('Copie o texto:', text); }
  };
  $('#img').onclick = () => cardImage(f, g).toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'copom-resultado-' + G.seed + '.png'; a.click(); });
  $('#save').onclick = () => {
    const name = ($('#nm').value || 'Anônimo').trim().slice(0, 20) || 'Anônimo';
    const r = loadRank(); r.push({ name, score: f.score, grade: g, seed: G.seed, date: Date.now() }); saveRank(r);
    const sorted = r.slice().sort((a, b) => b.score - a.score).slice(0, 10);
    const idx = sorted.findIndex(x => x.name === name && x.score === f.score && x.seed === G.seed);
    $('#rk').innerHTML = rankHtml(idx); $('#save').disabled = true; toast('Salvo no ranking');
  };
  window.scrollTo({ top: 0 });
}

// entrada: ?seed=123 abre direto o desafio
(function init() {
  const q = new URLSearchParams(location.search);
  const seed = parseInt(q.get('seed'), 10);
  if (seed) startGame(seed, q.get('vet') === '1'); else renderStart();
})();
</script>
</body>
</html>
