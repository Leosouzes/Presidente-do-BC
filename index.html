<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copom: você decide a Selic</title>
<script>try{var t=localStorage.getItem('copomgame.theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Newsreader:opsz,wght@6..72,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EEE4; --card:#F7F9F3; --raised:#FFFFFF; --ink:#12282A; --muted:#546D6E; --teal:#0F5C57; --teal-ink:#F4F8F2;
  --gold:#D9A21B; --red:#B3342B; --green:#2E7D4F; --line:#C9D4C7; --glow:rgba(15,92,87,.12);
  --display:'Archivo','Helvetica Neue',Arial,sans-serif; --serif:'Newsreader',Georgia,'Times New Roman',serif;
}
:root[data-theme=dark]{
  --paper:#0C1819; --card:#132526; --raised:#193133; --ink:#E6EFE8; --muted:#93ABAA; --teal:#4FC3B5; --teal-ink:#0C1819;
  --gold:#EAB94B; --red:#F27C70; --green:#6FCB94; --line:#264345; --glow:rgba(79,195,181,.14);
}
*{box-sizing:border-box}
html{scroll-padding-top:12px;color-scheme:light dark}
body{margin:0;background:var(--paper);background-image:radial-gradient(900px 420px at 90% -8%,var(--glow),transparent);background-repeat:no-repeat;color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3{margin:0;line-height:1.05}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding:8px 0 14px;border-bottom:2px solid var(--ink);margin-bottom:22px;flex-wrap:wrap}
.brand{font-weight:800;font-stretch:112%;font-size:20px;letter-spacing:-.01em}
.hdr-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ticks{display:flex;gap:5px;align-items:center}
.tick{width:24px;height:9px;border:2px solid var(--ink);border-radius:2px}
.tick.done{background:var(--teal);border-color:var(--teal)}
.tick.now{background:var(--gold)}
.ticklabel{font-size:14px;color:var(--muted);margin-right:8px}
.tools{display:flex;gap:6px}
.icon-btn{border:2px solid var(--line);background:transparent;border-radius:8px;height:36px;min-width:36px;padding:0 10px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.icon-btn:hover{border-color:var(--ink)}
.btn{border:2px solid var(--ink);background:transparent;border-radius:8px;padding:10px 16px;font-weight:700}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);padding:15px 22px;font-size:18px;font-stretch:105%;width:100%}
.btn.primary:hover{filter:brightness(1.1);background:var(--teal);color:var(--teal-ink)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}

/* início */
.hero{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;padding:8px 0 4px}
.rosette{position:absolute;right:-60px;top:-40px;width:420px;height:420px;opacity:.5;pointer-events:none;z-index:0}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(38px,6.2vw,66px);font-weight:900;font-stretch:118%;letter-spacing:-.03em}
.hero p.lead{font-family:var(--serif);font-size:20px;max-width:46ch;margin:16px 0 22px;line-height:1.55}
.modes{display:grid;gap:10px}
.mode{display:block;text-align:left;width:100%;padding:16px 18px;border:2px solid var(--ink);border-radius:12px;background:var(--card)}
.mode:hover{border-color:var(--teal);box-shadow:4px 4px 0 var(--teal)}
.mode b{font-size:19px;font-stretch:106%}
.mode span{color:var(--muted);font-size:14px}
.mode.main{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.mode.main span{color:inherit;opacity:.85}
.mode.main:hover{box-shadow:4px 4px 0 var(--ink)}
.opt{display:flex;gap:10px;align-items:flex-start;font-size:15px;max-width:52ch}
.opt input{margin-top:4px;width:18px;height:18px;accent-color:var(--teal)}
.seedrow{display:flex;gap:8px;margin-top:10px}
.seedrow input{flex:1;min-width:0;padding:10px;border:2px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.rules{margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rules .card{padding:14px}
.rules h3{font-size:16px;margin-bottom:6px}
.rules p{margin:0;font-size:14px;color:var(--muted)}

/* rodada */
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start}
.news{border-left:6px solid var(--gold);padding:4px 0 4px 16px;margin-bottom:18px}
.news h2{font-family:var(--serif);font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
.news p{font-family:var(--serif);font-size:19px;margin:0;line-height:1.55;max-width:60ch}
.news p.why{font-size:15px;font-style:italic;color:var(--muted);margin-top:8px}
.dial{padding:22px}
.dial .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dial .num{font-size:clamp(68px,13vw,116px);font-weight:900;font-stretch:125%;letter-spacing:-.04em;line-height:.95;font-variant-numeric:tabular-nums;display:inline-block}
.dial .num.bump{animation:bump .22s ease-out}
@keyframes bump{from{transform:scale(1.045)}to{transform:scale(1)}}
.dial .unit{font-size:28px;font-weight:700}
.delta{font-size:18px;font-weight:700;margin:6px 0 18px}
.delta.up{color:var(--red)}.delta.down{color:var(--teal)}.delta.flat{color:var(--muted)}
.rwrap{position:relative;padding:26px 0 22px;margin:0 2px}
.rwrap .sug{position:absolute;top:26px;height:34px;border-radius:6px;background:color-mix(in srgb,var(--gold) 30%,transparent);border:1px dashed var(--gold);pointer-events:none}
.rwrap .mk{position:absolute;top:8px;width:0;pointer-events:none}
.rwrap .mk::after{content:"";position:absolute;left:-1px;top:16px;width:2px;height:44px;background:var(--ink);opacity:.5}
.rwrap .mk em{position:absolute;left:0;transform:translateX(-50%);font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.rwrap .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
.ruler{-webkit-appearance:none;appearance:none;width:100%;height:34px;margin:0;background:transparent;cursor:pointer;position:relative;z-index:2}
.ruler::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(to right,var(--teal) var(--p,50%),var(--line) var(--p,50%))}
.ruler::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(to right,var(--teal) var(--p,50%),var(--line) var(--p,50%))}
.ruler::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-9px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);box-shadow:0 2px 0 var(--ink)}
.ruler::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--gold);border:3px solid var(--ink)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.quick .btn.sel{background:var(--ink);color:var(--paper)}
fieldset{border:0;margin:0 0 18px;padding:0}
legend{font-weight:700;margin-bottom:8px;padding:0}
.tones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tone{position:relative}
.tone input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.tone span{display:block;border:2px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;font-size:15px;font-weight:700}
.tone small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tone input:checked + span{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,transparent)}
.tone input:focus-visible + span{outline:3px solid var(--gold);outline-offset:2px}
.alert{border:2px solid var(--red);background:color-mix(in srgb,var(--red) 14%,transparent);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15px}
.dilema{border:2px solid var(--gold);border-radius:12px;padding:12px;margin:0 0 18px}
.dilema legend{padding:0 6px;font-weight:800}
.optcard{position:relative;display:block;margin:8px 0}
.optcard input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.optcard span{display:block;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.optcard b{display:block;font-size:15.5px}
.optcard small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.optcard input:checked + span{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,transparent)}
.optcard input:focus-visible + span{outline:3px solid var(--gold);outline-offset:2px}
.hint{background:color-mix(in srgb,var(--gold) 20%,transparent);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.cta{position:sticky;bottom:12px;z-index:5}
.cta .btn{box-shadow:0 10px 24px -10px rgba(0,0,0,.45)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:27px;font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.stat .d{font-size:12.5px;color:var(--muted);margin-top:6px}
.stat.ok{border-color:var(--green)}.stat.bad{border-color:var(--red)}
.pill{font-size:12px;font-weight:700;font-stretch:100%;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--green) 20%,transparent);color:var(--green)}
.pill.bad{background:color-mix(in srgb,var(--red) 20%,transparent);color:var(--red)}
.pill.flat{background:var(--line);color:var(--muted)}
.meter{position:relative;height:8px;border-radius:4px;background:var(--line);margin-top:8px}
.meter .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--green) 45%,transparent);border-radius:4px}
.meter .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6}
.meter b{position:absolute;top:-3px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ink);border:2px solid var(--card)}
.meter.fillbar b{top:0;left:0;height:8px;width:var(--w);margin:0;border:0;border-radius:4px;background:var(--teal)}
.chartcard{margin-top:10px;padding:12px}
.chartcard h3{font-size:15px;margin-bottom:6px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin-top:4px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
details.gloss{margin-top:10px;font-size:14px}
details.gloss summary{cursor:pointer;font-weight:700;padding:8px 0}
details.gloss dl{margin:6px 0 0;display:grid;gap:8px}
details.gloss dt{font-weight:700}
details.gloss dd{margin:0;color:var(--muted)}

/* comunicado */
.verdict{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.verdict .vn{font-size:clamp(52px,9vw,84px);font-weight:900;font-stretch:125%;letter-spacing:-.04em;line-height:.95;font-variant-numeric:tabular-nums}
.chip{border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;border:2px solid currentColor}
.chip.up{color:var(--red)}.chip.down{color:var(--teal)}.chip.flat{color:var(--muted)}
.facts{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.facts li{border-left:4px solid var(--line);padding:2px 0 2px 12px;font-family:var(--serif);font-size:18px;line-height:1.45}
.facts li.hl{border-color:var(--gold)}
.scorebox{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin:16px 0 18px}
.bigpts{font-size:56px;font-weight:900;font-stretch:120%;line-height:.9;letter-spacing:-.03em}
.bigpts small{display:block;font-size:14px;font-weight:600;font-stretch:100%;color:var(--muted);letter-spacing:0;margin-top:4px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--teal);border-radius:5px;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.imini{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.imini .stat .v{font-size:22px}
.imini .arrow{color:var(--muted);font-weight:500}

/* final */
.final{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.score{font-size:clamp(88px,17vw,160px);font-weight:900;font-stretch:125%;letter-spacing:-.04em;line-height:.9;font-variant-numeric:tabular-nums}
.grade{font-size:28px;font-weight:800;font-stretch:108%;margin:10px 0 4px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.badge{border:2px solid var(--gold);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.tl{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;margin:6px 0 4px;height:116px}
.tlc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--muted)}
.tlb{width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:var(--teal)}
.tla{font-weight:700;font-size:13px}
.tla.up{color:var(--red)}.tla.down{color:var(--teal)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.actions .btn.primary{width:auto}
.rank{list-style:none;margin:8px 0 0;padding:0}
.rank li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.rank li.me{font-weight:800}
.tabs{display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
.tabs .btn.sel{background:var(--ink);color:var(--paper)}
.table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.table td,.table th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.table td:first-child,.table th:first-child{text-align:left}
.table th{font-weight:600;color:var(--muted);font-size:13px}

/* overlay e avisos */
.overlay{position:fixed;inset:0;background:rgba(5,14,15,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--card);border:2px solid var(--ink);border-radius:14px;max-width:560px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.dlg h2{font-size:28px;margin-bottom:14px}
.dlg ol{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:12px}
.dlg li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.dlg li .n{width:34px;height:34px;border-radius:50%;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;font-weight:800}
.dlg li b{display:block;font-size:17px}
.dlg li span.t{color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
footer{margin-top:36px;font-size:13px;color:var(--muted);max-width:80ch}
.hidden{display:none!important}
@media(max-width:820px){
  .hero,.grid,.final{grid-template-columns:1fr}
  .rules{grid-template-columns:1fr}
  .rosette{width:300px;height:300px;right:-90px;top:-20px;opacity:.35}
  .bar{grid-template-columns:84px 1fr 40px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Copom: você decide</div>
    <div class="hdr-right">
      <div class="ticks" id="ticks" aria-live="polite"></div>
      <div class="tools">
        <button class="icon-btn" id="help" type="button">Como jogar</button>
        <button class="icon-btn" id="theme" type="button" aria-label="Alternar tema claro e escuro">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="app"></main>
  <footer>Simulador educativo com modelo simplificado e cenários fictícios. Não é recomendação de investimento nem previsão econômica. Meta de inflação: 3% ao ano, com tolerância de 1,5% a 4,5%.</footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
// ENGINE_START
const META = 3.0, BANDA_MIN = 1.5, BANDA_MAX = 4.5, RSTAR = 5.5;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// sup: choque de oferta (p.p. no IPCA 12m) | dem: choque de demanda (hiato) | fx: pressão cambial (%)
// exp: choque nas expectativas | fed: variação do juro americano | pressure: 'cut' = governo pressiona por corte
const SCENARIOS = [
  { id: 'petroleo', titulo: 'Petróleo dispara com tensão no Oriente Médio', texto: 'O barril sobe forte e a Petrobras avalia reajustar combustíveis. Economistas já revisam o IPCA para cima.', sup: 0.55, fx: 2.5, dem: -0.1 },
  { id: 'safra', titulo: 'Safra recorde derruba preço dos alimentos', texto: 'Hortifrúti e grãos ficam mais baratos no atacado. O alívio chega às prateleiras nas próximas semanas.', sup: -0.5, dem: 0.1 },
  { id: 'fed', titulo: 'Fed surpreende e sobe os juros americanos', texto: 'O banco central dos EUA eleva a taxa em 0,50 p.p. Dinheiro estrangeiro volta para o dólar e o real perde valor.', fed: 0.5, fx: 3.5, dem: -0.1 },
  { id: 'fiscal', titulo: 'Governo anuncia pacote de gastos sem compensação', texto: 'A equipe econômica libera despesas fora do arcabouço fiscal. O mercado reage mal e o dólar sobe.', dem: 0.6, exp: 0.25, fx: 3.0 },
  { id: 'emprego', titulo: 'Mercado de trabalho aquece e salários sobem', texto: 'O desemprego chega ao menor nível da série e os reajustes salariais superam a inflação em serviços.', dem: 0.4, sup: 0.2, exp: 0.1 },
  { id: 'energia', titulo: 'Seca castiga hidrelétricas e conta de luz sobe', texto: 'A bandeira tarifária vai para o vermelho. Os preços administrados pressionam o índice cheio.', sup: 0.6, dem: -0.2 },
  { id: 'politica', titulo: 'Planalto e Congresso pedem cortes de juros', texto: 'Em discurso, o governo diz que a Selic alta "sufoca o crescimento". A imprensa pergunta se o BC vai ceder.', pressure: 'cut', exp: 0.1 },
  { id: 'china', titulo: 'China desacelera e commodities caem', texto: 'Minério e soja recuam. As exportações brasileiras perdem fôlego, mas a inflação importada diminui.', sup: -0.3, dem: -0.35, fx: 1.5 },
  { id: 'credito', titulo: 'Crédito ao consumidor cresce em ritmo forte', texto: 'Os bancos ampliam concessões e as vendas do varejo surpreendem. A demanda doméstica ganha tração.', dem: 0.55 },
  { id: 'recessao_global', titulo: 'Economia global esfria', texto: 'PMIs fracos nos EUA e na Europa. Investidores correm para ativos seguros e o dólar se fortalece.', dem: -0.55, fx: 3.0 },

function scenarioFor(i, scs, s, ctx) {
  if (i >= 1 && i - ctx.last >= 2) {
    for (const c of CONDICIONAIS) {
      if (!ctx.used.has(c.id) && c.cond(s)) { ctx.used.add(c.id); ctx.last = i; return { ...c, isCond: true }; }
    }
  }
  return scs[i];
}

function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pickScenarios(seed) {
  const rng = mulberry32(seed * 7919 + 13);
  let pool = shuffle(SCENARIOS, rng);
  for (let tries = 0; tries < 40; tries++) {
    const pick = pool.slice(0, 8);
    const up = pick.filter(s => (s.sup || 0) + (s.dem || 0) * 0.5 + (s.exp || 0) > 0.25).length;
    const down = pick.filter(s => (s.sup || 0) + (s.dem || 0) * 0.5 + (s.exp || 0) < -0.2).length;
    const dil = pick.filter(s => s.dilema).length;
    const blind = pick.filter(s => s.blind).length;
    if (up >= 2 && down >= 2 && dil >= 2 && dil <= 4 && blind <= 1) return pick;
    pool = shuffle(pool, rng);
  }
  return pool.slice(0, 8);
}

function initialState() {
  return { round: 0, selic: 13.75, ipca: 4.4, exp: 4.3, gap: 0.3, unemp: 5.8, fx: 5.5, cred: 70, sm: 3.95, fed: 4.0, lastdS: 0, flags: {} };
}
const pib = s => 2.0 + 0.7 * s.gap;
function taylor(s) {
  const pi = 0.5 * (s.ipca + s.exp);
  return RSTAR + pi + 1.5 * (pi - META) + 0.5 * s.gap;
}
const roundQuarter = x => Math.round(x * 4) / 4;

// efeitos do cenário somados aos da opção do dilema
function effects(sc, opt) {
  const o = sc.dilema ? sc.dilema.opcoes[opt | 0] || {} : {};
  const sum = k => (sc[k] || 0) + (o[k] || 0);
  return { sup: sum('sup'), dem: sum('dem'), fx: sum('fx'), exp: sum('exp'), fed: sum('fed'), cred: sum('cred'), flags: o.flags || null, label: o.label || null };
}

// fim antecipado de mandato
function isOver(s) {
  if (s.cred <= 12) return 'confianca';
  if (s.ipca >= 8) return 'inflacao';
  if (s.unemp >= 9) return 'recessao';
  return null;
}

  confianca: 'O mercado perdeu a confiança no BC. Pressionado por todos os lados, você pede demissão.',

};

function step(s, newSelic, tone, sc, rng, opt) {
  const noise = () => (rng() + rng() + rng() - 1.5) * 1.15;
  const E = effects(sc, opt);
  const n = { ...s, flags: { ...s.flags } };
  const dS = newSelic - s.selic;
  n.round = s.round + 1;
  n.selic = newSelic;
  n.lastdS = dS;
  n.fed = s.fed + E.fed;
  if (E.flags) for (const k in E.flags) { n.flags[k] = E.flags[k]; n.flags[k + 'At'] = n.round; }

  // credibilidade
  let credD = E.cred, resisted = false;
  const tay = taylor(s);
  if (sc.pressure === 'cut' && s.exp > META + 0.6) {
    if (dS < 0) credD -= 6; else { credD += 3; resisted = true; }
  }
  if (s.exp > META + 1.0 && s.ipca > BANDA_MAX - 0.3 && dS < 0) credD -= 3;
  if (Math.abs(newSelic - tay) > 2.75) credD -= 3;
  if (s.ipca <= BANDA_MAX && s.ipca >= BANDA_MIN && Math.abs(s.exp - META) <= 0.6) credD += 1;
  if (s.exp > META + 0.5 && tone < 0) credD -= 2;
  if (s.exp > META + 0.5 && tone > 0) credD += 1;
  if (s.gap < -1.5 && tone > 0) credD -= 2;
  if (s.ipca > BANDA_MAX) credD -= 2;
  if (s.ipca < BANDA_MIN) credD -= 1;
  if (s.unemp > 8) credD -= 2;
  if (s.lastdS * dS < 0 && Math.abs(dS) >= 0.5 && Math.abs(s.lastdS) >= 0.5) credD -= 2; // vai e volta
  n.cred = clamp(s.cred + credD, 3, 100);

  // transmissão da política (menos eficaz com credibilidade baixa)
  const eff = 0.7 + 0.5 * (s.cred / 100);
  const rr = newSelic - s.exp;
  n.sm = 0.6 * s.sm + 0.4 * (rr - RSTAR);

  // câmbio
  const carry = newSelic - n.fed;
  let dfx = E.fx - 1.1 * dS - 0.30 * (carry - 9.75) - 0.06 * ((s.fx - 5.5) / 5.5) * 100 + (60 - n.cred) * 0.05 + noise() * 1.1;
  dfx = clamp(dfx, -10, 14);
  n.fx = clamp(s.fx * (1 + dfx / 100), 3.8, 9);

  // atividade
  n.gap = clamp(0.70 * s.gap - 0.20 * eff * n.sm + 0.1 + E.dem + 0.025 * dfx + (s.gap < -2 ? -0.1 : 0) + noise() * 0.15, -7, 7);
  const target = 6.2 - 0.45 * n.gap;
  n.unemp = clamp(s.unemp + 0.28 * (target - s.unemp), 3.0, 15, );

  // inflação 12m
  n.ipca = clamp(s.ipca + 0.24 * (0.5 * s.gap + 0.5 * n.gap) + 0.34 * (s.exp - s.ipca) + E.sup + 0.05 * dfx + noise() * 0.10, 0, 25);

  // expectativas
  const spiral = (s.exp > META + 1.5 && n.cred < 50) ? 0.15 : 0;
  n.exp = clamp(s.exp + 0.30 * (n.ipca - s.exp) + 0.13 * (n.cred / 100) * (META - s.exp)
    + E.exp - 0.12 * tone * (0.3 + n.cred / 100) + (70 - n.cred) * 0.006 + spiral + noise() * 0.05, 1.5, 14);

  const dist = 0.6 * Math.abs(n.ipca - META) + 0.4 * Math.abs(n.exp - META);
  const outBand = n.ipca > BANDA_MAX || n.ipca < BANDA_MIN;
  const parts = {
    inf: Math.max(0, 35 * (1 - Math.pow(Math.max(0, dist - 0.4) / 1.5, 1.4)) - (outBand ? 8 : 0)),
    act: Math.max(0, 30 * Math.max(0, 1 - (n.gap < 0 ? Math.abs(n.gap) / 2.2 : n.gap / 2.2)) - Math.max(0, n.unemp - 6.8) * 4),
    cr: 20 * Math.pow(n.cred / 100, 1.5),
    st: 10 * Math.max(0, 1 - Math.abs(dfx) / 6) + 5 * Math.max(0, 1 - Math.abs(dS) / 1.25),
  };
  parts.total = parts.inf + parts.act + parts.cr + parts.st;
  const over = isOver(n);
  return { state: n, dS, dfx, credD, resisted, parts, tone, scId: sc.id, opt: opt | 0, label: E.label, over };
}

function badges(hist, over) {
  const last = hist[hist.length - 1], out = [];
  if (over) return [['Mandato interrompido', OVER_TXT[over]]];
  if (last.ipca >= 2.5 && last.ipca <= 3.5) out.push(['Meta na mão', 'Terminou com o IPCA entre 2,5% e 3,5%.']);
  if (Math.abs(last.gap) <= 0.8 && last.ipca <= BANDA_MAX && last.ipca >= BANDA_MIN) out.push(['Pouso suave', 'Inflação dentro da banda e economia perto do potencial.']);
  if (hist.every(h => Math.abs(h.dS) <= 0.5)) out.push(['Sem sustos', 'Nenhuma decisão passou de 0,50 p.p.']);
  if (hist.some(h => h.resisted)) out.push(['Resistiu à pressão', 'Segurou a Selic quando o governo pediu corte.']);
  if (last.exp <= 3.5 && last.cred >= 80) out.push(['Expectativas ancoradas', 'Mercado acredita na meta.']);
  if (hist.filter(h => h.parts.total >= 75).length >= 5) out.push(['Consistência', 'Cinco reuniões ou mais com nota 75+.']);
  if (hist.every(h => h.ipca >= BANDA_MIN && h.ipca <= BANDA_MAX)) out.push(['Sempre na banda', 'IPCA dentro da tolerância em todas as reuniões.']);
  return out;
}

// Pontuação: reuniões finais pesam mais; o estado final dá bônus ou penalidades
function finalize(hist, veteran, over) {
  const W = i => 0.6 + 0.8 * (i / 7);
  let wsum = 0, tot = 0;
  for (let i = 0; i < 8; i++) { wsum += W(i); if (hist[i]) tot += W(i) * hist[i].parts.total; }
  const avg = tot / wsum;
  const last = hist[hist.length - 1];
  let bonus = 0;
  if (!over) {
    if (last.ipca >= 2.5 && last.ipca <= 3.5) bonus += 50;
    else if (last.ipca >= BANDA_MIN && last.ipca <= BANDA_MAX) bonus += 10;
    else bonus -= last.ipca > 6 ? 120 : 70;
    if (last.exp <= 3.5) bonus += 20; else if (last.exp > 4.5) bonus -= 40;
    if (last.unemp > 8) bonus -= 50;
    if (last.cred >= 80) bonus += 20; else if (last.cred < 40) bonus -= 50;
    bonus -= 20 * hist.filter(h => h.ipca > BANDA_MAX || h.ipca < BANDA_MIN).length;
  }
  let score = Math.round(avg * 10 + bonus);
  if (over) score = Math.round(score * 0.6);
  score = clamp(score, 0, 1000);
  if (veteran) score = Math.min(1000, Math.round(score * 1.1));
  return { score, avg, bonus, badges: badges(hist, over), over: over || null };
}
function grade(score, over) {
  if (over) return 'Demitido';
  if (score >= 840) return 'Lenda do Copom';
  if (score >= 740) return 'Guardião da Meta';
  if (score >= 640) return 'Gestor de Crise';
  if (score >= 540) return 'Diretor Prudente';
  if (score >= 380) return 'Estagiário Promovido';
  return 'Inflação Fora de Controle';
}
// Parecer da equipe técnica: simula a decisão sem ruído, olhando duas reuniões à frente (ignora o dilema e os imprevistos)
function advice(s, sc) {
  const rng0 = () => 0.5;
  let best = null;
  const lo = Math.max(2, s.selic - 2), hi = Math.min(25, s.selic + 2);
  for (let sel = lo; sel <= hi + 1e-9; sel += 0.25) {
    const a = step(s, sel, 0, sc, rng0, -1);
    const b = step(a.state, sel, 0, {}, rng0, -1);
    const v = a.parts.total + 0.9 * b.parts.total - (a.over ? 200 : 0);
    if (!best || v > best.v + 1e-9) best = { v, sel };
  }
  return roundQuarter(best.sel);
}

function chart(series, key, min, max, band) {
  const W = 360, H = 130, p = 22, n = series[0].length;
  const x = i => p + (n === 1 ? 0 : i * (W - p - 8) / (n - 1));
  const y = v => H - 18 - ((v - min) / (max - min)) * (H - 30);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${key === 'selic' ? 'Gráfico da Selic' : 'Gráfico de inflação e expectativas'}">`;
  if (band) svg += `<rect x="${p}" y="${y(band[1])}" width="${W - p - 8}" height="${y(band[0]) - y(band[1])}" fill="var(--green)" opacity=".16"/>`;
  [min, (min + max) / 2, max].forEach(v => svg += `<text x="0" y="${y(v) + 4}" font-size="10" fill="var(--muted)">${Math.round(v)}</text><line x1="${p}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`);
  series.forEach((vals, k) => {
    const colors = key === 'selic' ? ['var(--teal)'] : ['var(--red)', 'var(--gold)'];
    const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(clamp(v, min, max)).toFixed(1)}`).join(' ');
    svg += `<path d="${d}" fill="none" stroke="${colors[k]}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    svg += `<circle cx="${x(vals.length - 1)}" cy="${y(clamp(vals[vals.length - 1], min, max))}" r="4" fill="${colors[k]}"/>`;
  });
  return svg + '</svg>';
}

    <div class="card"><h3>Como se pontua</h3><p>Até 100 pontos por reunião (inflação, atividade, credibilidade e estabilidade). As últimas reuniões pesam mais, e o estado final da economia dá bônus ou penalidades. Se perder o cargo, a nota despenca.</p></div>
    <div class="card"><h3>Atenção às defasagens</h3><p>Os juros demoram a fazer efeito. Quem reage tarde demais, ou exagera, paga a conta nas reuniões seguintes.</p></div>
  </section>
  ${GLOBAL ? '<section class="card" id="gstart" style="margin-top:20px"></section>' : ''}
  ${rankHtml(null)}`;
  if (GLOBAL) mountBoard($('#gstart'), 'Ranking global', [{ label: 'Desafio de hoje', seed: daily }, { label: 'Geral', seed: null }]);
  $('#m-daily').onclick = () => startGame(daily, $('#vet').checked);
  $('#m-rand').onclick = () => startGame(100000 + Math.floor(Math.random() * 899999), $('#vet').checked);
  $('#m-seed').onclick = () => { const v = parseInt($('#seedin').value, 10); if (!v) return toast('Digite um código numérico'); startGame(v, $('#vet').checked); };
}

function rankHtml(meIdx) {
  const r = loadRank().sort((a, b) => b.score - a.score).slice(0, 10);
  if (!r.length) return '';
  return `<section class="card" style="margin-top:20px"><h3>Seus melhores mandatos (neste navegador)</h3><ol class="rank">${r.map((x, i) => `<li class="${i === meIdx ? 'me' : ''}"><span>${i + 1}. ${esc(x.name)} · ${esc(x.grade)}</span><span>${x.score} pts · #${x.seed}</span></li>`).join('')}</ol></section>`;
}

// ---------- rodada ----------
function renderRound() {
  G.phase = 'decide'; drawTicks();
  const s = G.s;
  const sc = G.scs[G.idx] = scenarioFor(G.idx, G.scs, s, G.ctx);
  G.blind = !!sc.blind; G.opt = null;
  const tay = advice(s, sc), showAdv = !G.veteran && !sc.blind;
  const lo = Math.max(2, s.selic - 3), hi = Math.min(25, s.selic + 3), span = hi - lo;
  const pos = v => clamp((v - lo) / span, 0, 1);
  const at = v => `calc(${pos(v) * 100}% + ${(0.5 - pos(v)) * 28}px)`;
  const sugLo = Math.max(lo, tay - 0.5), sugHi = Math.min(hi, tay + 0.5);
  G.choice = s.selic; G.tone = 0;
  app.innerHTML = `
  <div class="grid">
    <div>
      <article class="news" aria-labelledby="nt"><h2 id="nt">${sc.titulo}</h2><p>${sc.texto}</p>${sc.isCond ? '<p class="why">Este evento surgiu por causa dos seus números.</p>' : ''}</article>
      <section class="card dial" aria-label="Decisão da Selic">
        <div class="big"><span class="num" id="num">${fmt(s.selic)}</span><span class="unit">% ao ano</span></div>
        <div class="delta flat" id="delta" aria-live="polite">Manter a Selic</div>
        <div class="rwrap">
          ${!showAdv || sugHi < sugLo ? '' : `<span class="sug" style="left:${at(sugLo)};width:${Math.max(2, (pos(sugHi) - pos(sugLo)) * 100)}%"></span>`}
          <span class="mk" style="left:${at(s.selic)}"><em>atual</em></span>
          <input class="ruler" id="rule" type="range" min="${lo}" max="${hi}" step="0.25" value="${s.selic}" aria-label="Meta da Selic em % ao ano">
          <div class="ends"><span>${fmt(lo)}%</span><span>${fmt(hi)}%</span></div>
        </div>
        <div class="quick" id="quick">
          ${[-1, -0.5, -0.25, 0, 0.25, 0.5, 1].map(d => `<button class="btn small" data-d="${d}">${d === 0 ? 'Manter' : sgn(d)}</button>`).join('')}
        </div>
        ${showAdv ? `<div class="hint">A equipe técnica sugere uma Selic perto de <b>${fmt(tay)}%</b> (faixa pontilhada na régua). O parecer ignora o dilema e os imprevistos: o voto é seu.</div>` : sc.blind ? '<div class="hint">Sem dados oficiais, a equipe técnica não emite parecer nesta reunião.</div>' : ''}
        ${sc.dilema ? `<fieldset class="dilema"><legend>Dilema: ${sc.dilema.pergunta}</legend>${sc.dilema.opcoes.map((o, i) => `<label class="optcard"><input type="radio" name="opt" value="${i}"><span><b>${o.label}</b><small>${o.desc}</small></span></label>`).join('')}</fieldset>` : ''}
        <fieldset><legend>Tom do comunicado</legend>
          <div class="tones">
            <label class="tone"><input type="radio" name="tone" value="1"><span>Duro<small>vigilante com a inflação</small></span></label>
            <label class="tone"><input type="radio" name="tone" value="0" checked><span>Neutro<small>depende dos dados</small></span></label>
            <label class="tone"><input type="radio" name="tone" value="-1"><span>Flexível<small>atento à atividade</small></span></label>
          </div>
        </fieldset>
        <div class="cta"><button class="btn primary" id="go" type="button">Anunciar decisão</button></div>
      </section>
    </div>
    <div>${dashboard()}</div>
  </div>`;
  const num = $('#num');
  const upd = (animate) => {
    const d = G.choice - s.selic;
    num.textContent = fmt(G.choice);
    if (animate && !REDUCED) { num.classList.remove('bump'); void num.offsetWidth; num.classList.add('bump'); }
    const el = $('#delta');
    el.className = 'delta ' + (d > 0 ? 'up' : d < 0 ? 'down' : 'flat');
    el.textContent = d === 0 ? 'Manter a Selic' : (d > 0 ? 'Alta de ' : 'Corte de ') + fmt(Math.abs(d)) + ' p.p.';
    const r = $('#rule'); r.value = G.choice; r.style.setProperty('--p', (pos(G.choice) * 100).toFixed(1) + '%');
    document.querySelectorAll('#quick .btn').forEach(b => b.classList.toggle('sel', Math.abs(s.selic + parseFloat(b.dataset.d) - G.choice) < 1e-6));
    const need = sc.dilema && G.opt === null;
    $('#go').disabled = !!need;
    $('#go').textContent = need ? 'Escolha uma opção no dilema' : d === 0 ? `Anunciar: manter em ${fmt(G.choice)}%` : `Anunciar: ${d > 0 ? 'subir' : 'cortar'} para ${fmt(G.choice)}%`;
  };
  $('#rule').oninput = e => { G.choice = parseFloat(e.target.value); upd(true); };
  $('#quick').onclick = e => { const b = e.target.closest('button'); if (!b) return; G.choice = clamp(s.selic + parseFloat(b.dataset.d), lo, hi); upd(true); };
  document.querySelectorAll('input[name=tone]').forEach(r => r.onchange = () => G.tone = parseInt(r.value, 10));
  document.querySelectorAll('input[name=opt]').forEach(r => r.onchange = () => { G.opt = parseInt(r.value, 10); upd(false); });
  $('#go').onclick = decide;
  upd(false);
  window.scrollTo({ top: 0 });
}

function decide() {
  const prev = G.s, sc = G.scs[G.idx], opt = sc.dilema ? (G.opt === null ? 0 : G.opt) : 0;
  G.decisions.push({ selic: G.choice, tone: G.tone, opt });
  const r = step(prev, G.choice, G.tone, sc, G.rng, opt);
  G.s = r.state;
  if (r.over) G.over = r.over;
  G.hist.push({ ...r.state, prev, dS: r.dS, parts: r.parts, resisted: r.resisted, tone: G.tone, scId: sc.id, titulo: sc.titulo, credD: r.credD });
  G.series.push({ selic: r.state.selic, ipca: r.state.ipca, exp: r.state.exp });
  G.idx++;
  G.phase = 'outcome';
  renderOutcome(r, prev, sc);
}

function renderOutcome(r, prev, sc) {
  drawTicks();
  const s = G.s, p = r.parts, last = G.idx >= 8 || !!r.over, dS = r.dS;
  const facts = [];
  const di = s.ipca - prev.ipca, de = s.exp - prev.exp, dg = s.gap - prev.gap;
  facts.push([`O IPCA em 12 meses ${di > 0.02 ? 'subiu' : di < -0.02 ? 'caiu' : 'ficou estável'} (${fmt(prev.ipca)}% → ${fmt(s.ipca)}%) e as expectativas ${de > 0.02 ? 'pioraram' : de < -0.02 ? 'melhoraram' : 'ficaram estáveis'} (${fmt(prev.exp)}% → ${fmt(s.exp)}%).`, false]);
  facts.push([`A atividade ${dg > 0.15 ? 'ganhou ritmo' : dg < -0.15 ? 'perdeu ritmo' : 'seguiu estável'}, e o desemprego está em ${fmt(s.unemp, 1)}%.`, false]);
  if (Math.abs(r.dfx) > 2) facts.push([`O dólar ${r.dfx > 0 ? 'subiu' : 'caiu'} ${fmt(Math.abs(r.dfx), 1)}% e fechou a R$ ${fmt(s.fx)}.`, false]);
  if (r.resisted) facts.push(['Você resistiu à pressão política com as expectativas desancoradas. O mercado notou.', true]);
  else if (sc.pressure === 'cut' && dS < 0 && prev.exp > META + 0.6) facts.push(['Cortar sob pressão política, com a inflação esperada acima da meta, custou credibilidade.', true]);
  if (r.credD <= -3) facts.push(['A decisão foi mal recebida pelo mercado e a credibilidade caiu.', true]);
  else if (r.credD >= 2) facts.push(['A decisão foi bem recebida e a credibilidade subiu.', true]);
  if (r.label) facts.unshift([`Dilema: você optou por "${r.label}".`, true]);
  const chip = dS === 0 ? ['flat', 'Selic mantida'] : dS > 0 ? ['up', 'Alta de ' + fmt(dS) + ' p.p.'] : ['down', 'Corte de ' + fmt(-dS) + ' p.p.'];
  const closer = (a, b) => Math.abs(a - META) < Math.abs(b - META);
  const mini = (label, a, b, pl) => `<div class="stat"><div class="l">${label}</div><div class="v"><span>${b}</span>${pl}</div><div class="d"><span class="arrow">antes: ${a}</span></div></div>`;
  const bar = (name, v, max) => `<div class="bar"><span>${name}</span><i style="--w:${(v / max * 100).toFixed(0)}%"></i><b>${Math.round(v)}/${max}</b></div>`;
  app.innerHTML = `
  <div class="grid">
    <section class="card out">
      <p style="color:var(--muted);margin:0 0 8px">Comunicado do Copom · ${sc.titulo}</p>
      <div class="verdict"><span class="vn">${fmt(s.selic)}%</span><span class="chip ${chip[0]}">${chip[1]}</span></div>
      ${r.over ? `<div class="alert"><b>Mandato encerrado.</b> ${OVER_TXT[r.over]}</div>` : ''}
      <ul class="facts">${facts.map(f => `<li class="${f[1] ? 'hl' : ''}">${f[0]}</li>`).join('')}</ul>
      <div class="scorebox">
        <div class="bigpts"><span id="bp" data-pts="${Math.round(p.total)}">0</span><small>pontos nesta reunião</small></div>
        <div class="bars">${bar('Inflação', p.inf, 40)}${bar('Atividade', p.act, 30)}${bar('Credibilidade', p.cr, 20)}${bar('Câmbio', p.st, 10)}</div>
      </div>
      <button class="btn primary" id="next" type="button">${last ? 'Ver resultado final' : 'Ir para a próxima reunião'}</button>
    </section>
    <div class="imini">
      ${mini('IPCA 12m', fmt(prev.ipca) + '%', fmt(s.ipca) + '%', pill(di, closer(s.ipca, prev.ipca), 2, ' p.p.'))}
      ${mini('Focus', fmt(prev.exp) + '%', fmt(s.exp) + '%', pill(de, closer(s.exp, prev.exp), 2, ' p.p.'))}
      ${mini('PIB 12m', fmt(pib(prev), 1) + '%', fmt(pib(s), 1) + '%', pill(pib(s) - pib(prev), pib(s) >= pib(prev), 1, ' p.p.'))}
      ${mini('Desemprego', fmt(prev.unemp, 1) + '%', fmt(s.unemp, 1) + '%', pill(s.unemp - prev.unemp, s.unemp <= prev.unemp, 1, ' p.p.'))}
      ${mini('Dólar', 'R$ ' + fmt(prev.fx), 'R$ ' + fmt(s.fx), pill(s.fx - prev.fx, s.fx <= prev.fx, 2))}
      ${mini('Credibilidade', Math.round(prev.cred), Math.round(s.cred), pill(s.cred - prev.cred, s.cred >= prev.cred, 0))}
    </div>
  </div>`;
  animateNum($('#bp'), Math.round(p.total), v => String(Math.round(v)), 700);
  $('#next').onclick = () => last ? renderFinal() : renderRound();
  window.scrollTo({ top: 0 });
}

// ---------- compartilhar ----------
function shareLink() {
  const base = location.protocol === 'file:' ? '(link do jogo)' : location.origin + location.pathname;
  return base + '?seed=' + G.seed + (G.veteran ? '&vet=1' : '');
}
function shareText(f, g) {
  const s = G.s;
  return `🏦 Fui presidente do Banco Central no "Copom: você decide" e fiz ${f.score} pontos (${g}).\nSelic final: ${fmt(s.selic)}% · IPCA: ${fmt(s.ipca)}% · Desemprego: ${fmt(s.unemp, 1)}%\nConsegue me superar? Desafio #${G.seed}: ${shareLink()}`;
}

function cardImage(f, g) {
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
  const x = c.getContext('2d'), s = G.s;
  const sans = "Archivo, 'Helvetica Neue', Arial, sans-serif";
  x.fillStyle = '#0F5C57'; x.fillRect(0, 0, 1080, 1350);
  x.fillStyle = '#E9EEE4'; x.fillRect(48, 48, 984, 1254);
  x.fillStyle = '#12282A'; x.font = `800 44px ${sans}`; x.fillText('Copom: você decide', 96, 140);
  x.fillStyle = '#D9A21B'; x.fillRect(96, 170, 160, 10);
  x.fillStyle = '#12282A'; x.font = `900 260px ${sans}`; x.fillText(String(f.score), 90, 450);
  x.font = `800 60px ${sans}`; x.fillText(g, 96, 560);
  x.font = `400 34px ${sans}`; x.fillStyle = '#546D6E'; x.fillText('pontos de 1000' + (G.veteran ? ' · modo veterano' : ''), 96, 615);
  // mini gráfico da Selic
  const sel = G.series.map(r => r.selic), mn = Math.min(...sel) - 1, mx = Math.max(...sel) + 1;
  const X = i => 96 + i * (888 / (sel.length - 1)), Y = v => 720 - ((v - mn) / (mx - mn)) * 70;
  x.strokeStyle = '#0F5C57'; x.lineWidth = 6; x.lineJoin = 'round'; x.beginPath();
  sel.forEach((v, i) => i ? x.lineTo(X(i), Y(v)) : x.moveTo(X(i), Y(v))); x.stroke();
  x.fillStyle = '#D9A21B'; x.beginPath(); x.arc(X(sel.length - 1), Y(sel[sel.length - 1]), 10, 0, 7); x.fill();
  x.fillStyle = '#546D6E'; x.font = `500 26px ${sans}`; x.fillText('Selic ao longo do mandato', 96, 750);
  const rows = [['Selic final', fmt(s.selic) + '%'], ['IPCA em 12 meses', fmt(s.ipca) + '%'], ['Expectativa Focus', fmt(s.exp) + '%'], ['Desemprego', fmt(s.unemp, 1) + '%'], ['Credibilidade', Math.round(s.cred) + '/100']];
  rows.forEach((r, i) => {
    const y = 840 + i * 80;
    x.fillStyle = '#C9D4C7'; x.fillRect(96, y + 26, 888, 3);
    x.fillStyle = '#12282A'; x.font = `500 36px ${sans}`; x.fillText(r[0], 96, y);
    x.font = `800 42px ${sans}`; x.textAlign = 'right'; x.fillText(r[1], 984, y); x.textAlign = 'left';
  });
  x.fillStyle = '#12282A'; x.font = `700 36px ${sans}`; x.fillText('Desafio #' + G.seed + ' · consegue me superar?', 96, 1260);
  return c;
}

// ---------- resultado final ----------
function renderFinal() {
  G.phase = 'final'; drawTicks();
  const f = finalize(G.hist, G.veteran, G.over), g = grade(f.score, G.over), s = G.s;
  const inBand = G.hist.filter(h => h.ipca >= BANDA_MIN && h.ipca <= BANDA_MAX).length;
  app.innerHTML = `
  <div class="final">
    <section class="card">
      <h2 style="font-size:22px;margin-bottom:6px">${G.over ? 'Mandato interrompido' : 'Fim do mandato'}</h2>
      ${G.over ? `<div class="alert">${OVER_TXT[G.over]} Você ficou ${G.hist.length} de 8 reuniões no cargo.</div>` : ''}
      <div class="score" id="sc" data-score="${f.score}">0</div>
      <div class="grade">${g}</div>
      <p style="color:var(--muted);margin:0">de 1000 pontos${G.veteran ? ' (com bônus do modo veterano)' : ''} · desafio #${G.seed}</p>
      <details class="gloss" style="margin:10px 0"><summary>Como sua nota foi calculada</summary><dl>
        <dt>Desempenho nas reuniões: ${Math.round(f.avg * 10)}</dt><dd>Média ponderada das notas de cada reunião. As últimas pesam mais que as primeiras.</dd>
        <dt>Estado final da economia: ${f.bonus > 0 ? '+' : ''}${Math.round(f.bonus)}</dt><dd>Bônus por terminar com inflação e expectativas na meta e credibilidade alta. Penalidades por inflação fora da banda, desemprego alto e reuniões fora da banda.</dd>
        ${G.over ? '<dt>Perda do cargo: nota reduzida em 40%</dt><dd>Sair antes do fim do mandato custa caro.</dd>' : ''}${G.veteran ? '<dt>Modo veterano: +10%</dt><dd>Bônus por jogar sem parecer técnico.</dd>' : ''}
      </dl></details>
      <div class="badges">${f.badges.map(b => `<span class="badge" title="${esc(b[1])}">${b[0]}</span>`).join('') || '<span style="color:var(--muted)">Nenhuma conquista desta vez.</span>'}</div>
      <div class="actions">
        <button class="btn primary" id="share" type="button">Compartilhar resultado</button>
        <button class="btn" id="img" type="button">Baixar imagem</button>
        <button class="btn" id="again" type="button">Jogar de novo</button>
      </div>
      <div class="seedrow" style="margin-top:18px"><input id="nm" maxlength="20" placeholder="Seu nome para o ranking" aria-label="Seu nome"><button class="btn" id="save" type="button">${GLOBAL ? 'Enviar ao ranking' : 'Salvar'}</button></div>
      <div id="gb" style="margin-top:20px"></div><div id="rk">${rankHtml(null)}</div>
    </section>
    <section>
      <div class="stats">
        ${statCard('Selic final', fmt(s.selic) + '%', 'começou em 13,75%')}
        ${statCard('IPCA final', fmt(s.ipca) + '%', inBand + ' de ' + G.hist.length + ' reuniões dentro da banda', { cls: s.ipca <= BANDA_MAX && s.ipca >= BANDA_MIN ? 'ok' : 'bad', meter: meter(s.ipca, 0, 8, [BANDA_MIN, BANDA_MAX], META) })}
        ${statCard('Expectativa final', fmt(s.exp) + '%', 'meta de 3%', { meter: meter(s.exp, 0, 8, [BANDA_MIN, BANDA_MAX], META) })}
        ${statCard('Desemprego final', fmt(s.unemp, 1) + '%', 'começou em 5,8%')}
      </div>
      <div class="card chartcard"><h3>Nota por reunião e direção da Selic</h3>
        <div class="tl" style="grid-template-columns:repeat(${G.hist.length},1fr)">${G.hist.map((h, i) => `<div class="tlc"><span class="tla ${h.dS > 0 ? 'up' : h.dS < 0 ? 'down' : ''}">${h.dS > 0 ? '▲' : h.dS < 0 ? '▼' : '–'}</span><div class="tlb" style="height:${Math.max(6, h.parts.total * 0.8).toFixed(0)}px"></div><span>${i + 1}</span></div>`).join('')}</div>
      </div>
      <div class="card chartcard"><h3>Sua Selic</h3>${chart([G.series.map(r => r.selic)], 'selic', 2, 25)}</div>
      <div class="card chartcard"><h3>Inflação e expectativas</h3>${chart([G.series.map(r => r.ipca), G.series.map(r => r.exp)], 'infl', 0, 10, [BANDA_MIN, BANDA_MAX])}</div>
      <table class="table card" style="display:table;margin-top:10px"><thead><tr><th>Reunião</th><th>Selic</th><th>Nota</th></tr></thead><tbody>
        ${G.hist.map((h, i) => `<tr><td>${i + 1}. ${esc(h.titulo.length > 34 ? h.titulo.slice(0, 33) + '…' : h.titulo)}</td><td>${fmt(h.selic)}%</td><td>${Math.round(h.parts.total)}</td></tr>`).join('')}
      </tbody></table>
    </section>
  </div>`;
  animateNum($('#sc'), f.score, v => String(Math.round(v)), 1100);
  if (GLOBAL) mountBoard($('#gb'), 'Ranking global', [{ label: 'Este desafio #' + G.seed, seed: G.seed }, { label: 'Geral', seed: null }]);
  $('#again').onclick = renderStart;
  $('#share').onclick = async () => {
    const text = shareText(f, g);
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text); toast('Texto copiado'); } catch (e) { prompt('Copie o texto:', text); }
  };
  $('#img').onclick = () => cardImage(f, g).toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'copom-resultado-' + G.seed + '.png'; a.click(); });
  $('#save').onclick = async () => {
    const name = ($('#nm').value || 'Anônimo').trim().slice(0, 20) || 'Anônimo';
    const btn = $('#save'); btn.disabled = true;
    const r = loadRank(); r.push({ name, score: f.score, grade: g, seed: G.seed, date: Date.now() }); saveRank(r);
    const sorted = r.slice().sort((a, b) => b.score - a.score).slice(0, 10);
    const idx = sorted.findIndex(x => x.name === name && x.score === f.score && x.seed === G.seed);
    $('#rk').innerHTML = rankHtml(idx);
    if (!GLOBAL) { toast('Salvo no ranking'); return; }
    const res = await submitGlobal(name);
    if (res.ok) { toast('Enviado ao ranking global'); mountBoard($('#gb'), 'Ranking global', [{ label: 'Este desafio #' + G.seed, seed: G.seed }, { label: 'Geral', seed: null }], 0, { name, score: res.score, seed: G.seed }); }
    else { toast(res.error || 'Não foi possível enviar'); if (res.status !== 409) btn.disabled = false; }
  };
  window.scrollTo({ top: 0 });
}

// entrada: ?seed=123 abre direto o desafio
(function init() {
  const q = new URLSearchParams(location.search);
  const seed = parseInt(q.get('seed'), 10);
  if (seed) startGame(seed, q.get('vet') === '1'); else renderStart();
})();
</script>
